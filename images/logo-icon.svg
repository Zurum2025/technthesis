<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Tech 'n Thesis icon">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Rounded navy badge -->
  <rect x="0" y="0" width="100" height="100" rx="24" fill="#0f172a"/>
  <!-- Tau (τ) big, accent -->
  <text x="12" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="86"
        fill="url(#acc)">&#964;</text>
  <!-- Theta (Θ) overlapping upper-right, white with accent ring feel -->
  <text x="52" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="52"
        fill="#ffffff">&#920;</text>
</svg>
